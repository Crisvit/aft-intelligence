name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Comprobación de sintaxis (server.js, src/, scripts/)
        run: |
          node --check server.js
          for f in src/*.js scripts/*.js; do node --check "$f"; done

      - name: Tests (node:test — sin base de datos ni red real)
        run: npm test
